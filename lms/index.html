<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AfriTutor LMS — Subjects Dashboard</title>
  <link rel="stylesheet" href="lms/style.css">
  <link rel="manifest" href="lms/manifest.json">
</head>
<body>
  <header class="lms-header" role="banner">
    <h1 id="lms-title">AfriTutor — Learning Dashboard</h1>
    <nav aria-label="Main actions">
      <button id="btn-new-lesson" class="btn">Start Lesson</button>
      <button id="btn-open-profile" class="btn">Profile</button>
    </nav>
  </header>

  <main id="lms-root" class="lms-root">
    <section id="subjects" class="subjects" aria-label="Subjects dashboard" role="list"></section>

    <aside id="analytics" class="analytics" aria-label="Progress analytics">
      <h2>Progress Overview</h2>
      <div id="radar" aria-hidden="true"></div>
      <div id="heatmap" aria-hidden="true"></div>
    </aside>
  </main>

  <template id="subject-card-template">
    <article class="subject-card" draggable="true" role="listitem" aria-grabbed="false">
      <div class="card-inner" tabindex="0">
        <div class="card-top">
          <div class="avatar" aria-hidden="true"></div>
          <div class="title-wrap">
            <h3 class="subject-title"></h3>
            <div class="meta"><span class="level"></span><span class="streak"></span></div>
          </div>
        </div>
        <div class="progress-wrap">
          <svg class="progress-ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" cx="20" cy="20" r="16"/></svg>
          <div class="mastery" aria-hidden="true"></div>
        </div>
        <div class="card-actions">
          <button class="btn start-lesson">Start</button>
          <button class="btn more" aria-haspopup="true">More</button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="lms/app.js" defer></script>
</body>
</html>
