<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AfriTutor — 3D Metaverse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 3D background canvas (aria-hidden) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="ui-overlay">
    <header class="top-controls">
      <button id="toggle-3d" class="btn" aria-pressed="true">Toggle 3D</button>
      <button id="enter-xr" class="btn">Enter XR</button>
      <div class="title">AfriTutor Metaverse — 3D Hub</div>
    </header>

    <main id="chat-app" class="app" aria-labelledby="app-title">
      <h1 id="app-title" class="visually-hidden">AfriTutor 3D</h1>

      <section class="chat-header">
        <div class="brand">
          <div class="title">AfriTutor</div>
        </div>
        <div class="controls">
          <button id="clear-session" class="btn" aria-label="Clear chat session">Clear</button>
        </div>
      </section>

      <section id="conversation" class="conversation" role="log" aria-live="polite" tabindex="0"></section>

      <form id="composer" class="composer" autocomplete="off" aria-label="Message composer">
        <label for="input" class="visually-hidden">Type your message</label>
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="Type a message... (English, Amharic, Kiswahili)" aria-label="Message input"></textarea>
          <div class="composer-actions">
            <button type="button" id="send" class="btn primary" aria-label="Send message">Send</button>
          </div>
        </div>
      </form>

    </main>
  </div>

  <script type="module" src="3d/scene.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
